<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة إنجاز الدروس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        /* الجزء العلوي المثبت: النسب + الأزرار + رأس الجدول */
        .sticky-top-section {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: #ffffff;
            padding-top: 8px;
            padding-bottom: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        /* مؤشر نسبة الإنجاز للفصل الأول والثاني */
        .single-progress-box {
            background: #f8f9fa;
            border: 1px solid #e1e5e8;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .progress-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .class-selector-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }
        .class-selector-group select {
            width: auto;
            min-width: 140px;
            padding: 6px 10px;
        }
        .terms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }
        .term-card {
            background: #ffffff;
            border: 1px solid #e5e8eb;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .term-title {
            color: #2c3e50;
            font-size: 14px;
        }
        .progress-percent {
            color: #27ae60;
            font-size: 17px;
        }
        .progress-percent.term2 {
            color: #2980b9;
        }
        .progress-count {
            color: #555;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: 600;
        }
        .progress-bar-bg {
            width: 100%;
            height: 9px;
            background-color: #e9ecef;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            border-radius: 999px;
            transition: width 0.3s ease;
        }
        .progress-bar-fill.term2 {
            background-color: #2980b9;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button.print-btn {
            background-color: #2980b9;
        }
        button.print-btn:hover {
            background-color: #2471a3;
        }
        button.delete-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 13px;
        }
        button.delete-btn:hover {
            background-color: #c0392b;
        }

        /* جداول رأس الجدول وبياناته */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            table-layout: fixed;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #dcdde1;
            padding: 12px;
            text-align: center;
            position: relative;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            background-color: #fff;
            font-family: inherit;
        }
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #27ae60;
        }

        /* تنسيق الشطب الخطي بالأحمر على كامل السطر */
        tr.completed {
            background-color: #fff5f5;
        }
        tr.completed td {
            color: #888;
        }
        tr.completed select {
            color: #888;
            background-color: #fdfdfd;
        }
        tr.completed td::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background-color: #e74c3c;
            pointer-events: none;
        }
        .date-cell {
            font-weight: bold;
            color: #2c3e50;
            min-width: 140px;
        }

        @media print {
            .controls, .action-col {
                display: none !important;
            }
            .sticky-top-section {
                position: static;
                box-shadow: none;
            }
            body {
                background: #fff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .single-progress-box, .term-card {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>سجل متابعة إنجاز الدروس</h1>

    <div class="sticky-top-section">
        <div class="single-progress-box">
            <div class="progress-top-row">
                <div class="class-selector-group">
                    <label for="selectedClassProgress">إنجاز الفصل:</label>
                    <select id="selectedClassProgress" onchange="renderSingleClassProgress()"></select>
                </div>
            </div>

            <div class="terms-grid">
                <div class="term-card">
                    <div class="term-header">
                        <span class="term-title">الفصل الأول</span>
                        <span id="term1Percent" class="progress-percent">0%</span>
                    </div>
                    <div id="term1Count" class="progress-count">الدروس المنجزة: 0 من 0</div>
                    <div class="progress-bar-bg">
                        <div id="term1Bar" class="progress-bar-fill"></div>
                    </div>
                </div>

                <div class="term-card">
                    <div class="term-header">
                        <span class="term-title">الفصل الثاني</span>
                        <span id="term2Percent" class="progress-percent term2">0%</span>
                    </div>
                    <div id="term2Count" class="progress-count">الدروس المنجزة: 0 من 0</div>
                    <div class="progress-bar-bg">
                        <div id="term2Bar" class="progress-bar-fill term2"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="addRow()">+ إضافة سطر جديد</button>
            <button class="print-btn" onclick="window.print()">طباعة الجدول</button>
        </div>

        <table class="header-table">
            <thead>
                <tr>
                    <th style="width: 15%;">الفصل</th>
                    <th style="width: 45%;">الدرس</th>
                    <th style="width: 12%;">الإنجاز</th>
                    <th style="width: 20%;">تاريخ الإنجاز</th>
                    <th class="action-col" style="width: 8%;">حذف</th>
                </tr>
            </thead>
        </table>
    </div>

    <table id="lessonsTable" class="data-table">
        <colgroup>
            <col style="width: 15%;">
            <col style="width: 45%;">
            <col style="width: 12%;">
            <col style="width: 20%;">
            <col class="action-col" style="width: 8%;">
        </colgroup>
        <tbody id="tableBody">
            <!-- الصفوف تضاف هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    const classesList = ["أول - 1", "أول - 2", "أول - 3", "أول - 4"];
    
    const lessonsList = [
        "المجموعة الشمسية",
        "شكل الأرض",
        "خطوط الطول ودوائر العرض",
        "حركة الأرض",
        "سطح الأرض",
        "الحضارات القديمة",
        "الحضارة الإسلامية",
        "العلوم والمعارف في الحضارة الإسلامية",
        "العمارة والفنون في الحضارة الإسلامية",
        "الجوانب الاقتصادية في الحضارة الإسلامية",
        "التخطيط وأهدافه",
        "تنظيم الوقت",
        "شبه الجزيرة العربية قبل ظهور الإسلام",
        "حياة النبي محمد صلى الله عليه وسلم قبل البعثة",
        "نزول الوحي والدعوة",
        "هجرة النبي محمد صلى الله عليه وسلم",
        "غزوات النبي محمد صلى الله عليه وسلم",
        "شمائل النبي محمد صلى الله عليه وسلم",
        "حجة الوداع ووفاة النبي محمد صلى الله عليه وسلم",
        "=================================",
        "الخلفاء الراشدون رضي الله عنهم: أخلاقهم وخلافتهم",
        "أعمال الخلفاء الراشدين رضي الله عنهم",
        "جهود الخلفاء الراشدين رضي الله عنهم في نشر الإسلام",
        "المباديء والقيم الإسلامية في عهد الخلفاء الراشدين",
        "الهوية الذاتية",
        "التنمية الذاتية",
        "التفاعل الاجتماعي",
        "مفهوم الأمن الوطني",
        "ركائز الأمن الوطني",
        "مجالات الأمن الوطني",
        "مؤسسات الأمن الوطني",
        "المواطن والأمن الوطني",
        "مفهوم الحوار وأهميته",
        "أركان الحوار",
        "آداب الحوار",
        "الحوار الوطني"
    ];

    const dividerIndex = lessonsList.findIndex(item => item.startsWith("==="));
    const firstTermLessons = (dividerIndex !== -1 ? lessonsList.slice(0, dividerIndex) : lessonsList)
        .filter(item => !item.startsWith("==="));
    const secondTermLessons = (dividerIndex !== -1 ? lessonsList.slice(dividerIndex + 1) : [])
        .filter(item => !item.startsWith("==="));
    const validLessons = [...firstTermLessons, ...secondTermLessons];

    let savedData = JSON.parse(localStorage.getItem('lessonsTrackerData')) || [
        { classVal: classesList[0], lessonVal: firstTermLessons[0], completed: false, date: "" }
    ];

    function populateClassProgressDropdown() {
        const selector = document.getElementById('selectedClassProgress');
        const currentValue = selector.value;
        selector.innerHTML = '';

        classesList.forEach(cls => {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            selector.appendChild(option);
        });

        if (currentValue && classesList.includes(currentValue)) {
            selector.value = currentValue;
        } else if (classesList.length > 0) {
            selector.value = classesList[0];
        }
    }

    function calculateTermStats(cls, termLessons) {
        const totalCount = termLessons.length;
        const completedSet = new Set(
            savedData
                .filter(row => row.classVal === cls && row.completed && termLessons.includes(row.lessonVal))
                .map(row => row.lessonVal)
        );
        const completedCount = completedSet.size;
        const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
        return { completedCount, totalCount, percent };
    }

    function renderSingleClassProgress() {
        const selector = document.getElementById('selectedClassProgress');
        const cls = selector.value || classesList[0];

        const term1 = calculateTermStats(cls, firstTermLessons);
        const term2 = calculateTermStats(cls, secondTermLessons);

        document.getElementById('term1Count').textContent = `الدروس المنجزة: ${term1.completedCount} من ${term1.totalCount}`;
        document.getElementById('term1Percent').textContent = `${term1.percent}%`;
        document.getElementById('term1Bar').style.width = `${term1.percent}%`;

        document.getElementById('term2Count').textContent = `الدروس المنجزة: ${term2.completedCount} من ${term2.totalCount}`;
        document.getElementById('term2Percent').textContent = `${term2.percent}%`;
        document.getElementById('term2Bar').style.width = `${term2.percent}%`;
    }

    function renderTable() {
        populateClassProgressDropdown();
        renderSingleClassProgress();

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        savedData.forEach((row, index) => {
            const tr = document.createElement('tr');
            if (row.completed) {
                tr.classList.add('completed');
            }

            const tdClass = document.createElement('td');
            const selectClass = document.createElement('select');
            classesList.forEach(cls => {
                const option = document.createElement('option');
                option.value = cls;
                option.textContent = cls;
                if (cls === row.classVal) option.selected = true;
                selectClass.appendChild(option);
            });
            selectClass.onchange = (e) => updateRow(index, 'classVal', e.target.value, true);
            tdClass.appendChild(selectClass);

            const tdLesson = document.createElement('td');
            const selectLesson = document.createElement('select');
            lessonsList.forEach(lesson => {
                const option = document.createElement('option');
                option.value = lesson;
                option.textContent = lesson;
                if (lesson.startsWith("===")) {
                    option.disabled = true;
                }
                if (lesson === row.lessonVal) option.selected = true;
                selectLesson.appendChild(option);
            });
            selectLesson.onchange = (e) => updateRow(index, 'lessonVal', e.target.value, true);
            tdLesson.appendChild(selectLesson);

            const tdCheck = document.createElement('td');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = row.completed;
            checkbox.onchange = (e) => toggleComplete(index, e.target.checked);
            tdCheck.appendChild(checkbox);

            const tdDate = document.createElement('td');
            tdDate.className = 'date-cell';
            tdDate.textContent = row.date;

            const tdAction = document.createElement('td');
            tdAction.className = 'action-col';
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = 'حذف';
            delBtn.onclick = () => deleteRow(index);
            tdAction.appendChild(delBtn);

            tr.appendChild(tdClass);
            tr.appendChild(tdLesson);
            tr.appendChild(tdCheck);
            tr.appendChild(tdDate);
            tr.appendChild(tdAction);

            tbody.appendChild(tr);
        });
    }

    function addRow() {
        savedData.push({
            classVal: classesList[0],
            lessonVal: validLessons[0],
            completed: false,
            date: ""
        });
        saveAndRender();
    }

    function updateRow(index, key, value, refreshProgress = false) {
        savedData[index][key] = value;
        saveData();
        if (refreshProgress) {
            renderSingleClassProgress();
        }
    }

    function toggleComplete(index, isChecked) {
        savedData[index].completed = isChecked;
        if (isChecked) {
            const now = new Date();
            const options = { 
                calendar: 'gregory', 
                weekday: 'long', 
                year: 'numeric', 
                month: 'numeric', 
                day: 'numeric' 
            };
            savedData[index].date = now.toLocaleDateString('ar-SA-u-ca-gregory', options);
        } else {
            savedData[index].date = "";
        }
        saveAndRender();
    }

    function deleteRow(index) {
        savedData.splice(index, 1);
        saveAndRender();
    }

    function saveData() {
        localStorage.setItem('lessonsTrackerData', JSON.stringify(savedData));
    }

    function saveAndRender() {
        saveData();
        renderTable();
    }

    renderTable();
</script>

</body>
</html>
