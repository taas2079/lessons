<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة إنجاز الدروس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button.print-btn {
            background-color: #2980b9;
        }
        button.print-btn:hover {
            background-color: #2471a3;
        }
        button.delete-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 13px;
        }
        button.delete-btn:hover {
            background-color: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dcdde1;
            padding: 12px;
            text-align: center;
            position: relative;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            background-color: #fff;
            font-family: inherit;
        }
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #27ae60;
        }
        /* تنسيق الشطب الخطي بالأحمر على كامل السطر */
        tr.completed {
            background-color: #fff5f5;
        }
        tr.completed td {
            color: #888;
        }
        tr.completed select {
            color: #888;
            background-color: #fdfdfd;
        }
        tr.completed td::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background-color: #e74c3c;
            pointer-events: none;
        }
        .date-cell {
            font-weight: bold;
            color: #2c3e50;
            min-width: 140px;
        }
        @media print {
            .controls, .action-col {
                display: none !important;
            }
            body {
                background: #fff;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>سجل متابعة إنجاز الدروس</h1>
    
    <div class="controls">
        <button onclick="addRow()">+ إضافة سطر جديد</button>
        <button class="print-btn" onclick="window.print()">طباعة الجدول</button>
    </div>

    <table id="lessonsTable">
        <thead>
            <tr>
                <th style="width: 15%;">الفصل</th>
                <th style="width: 45%;">الدرس</th>
                <th style="width: 12%;">الإنجاز</th>
                <th style="width: 20%;">تاريخ الإنجاز</th>
                <th class="action-col" style="width: 8%;">حذف</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- الصفوف تضاف هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    const classesList = ["أول - 1", "أول - 2", "أول - 3", "أول - 4"];
    
    const lessonsList = [
        "المجموعة الشمسية",
        "شكل الأرض",
        "خطوط الطول ودوائر العرض",
        "حركة الأرض",
        "سطح الأرض",
        "الحضارات القديمة",
        "الحضارة الإسلامية",
        "العلوم والمعارف في الحضارة الإسلامية",
        "العمارة والفنون في الحضارة الإسلامية",
        "الجوانب الاقتصادية في الحضارة الإسلامية",
        "التخطيط وأهدافه",
        "تنظيم الوقت",
        "شبه الجزيرة العربية قبل ظهور الإسلام",
        "حياة النبي محمد صلى الله عليه وسلم قبل البعثة",
        "نزول الوحي والدعوة",
        "هجرة النبي محمد صلى الله عليه وسلم",
        "غزوات النبي محمد صلى الله عليه وسلم",
        "شمائل النبي محمد صلى الله عليه وسلم",
        "حجة الوداع ووفاة النبي محمد صلى الله عليه وسلم"
        "================================="
        "الخلفاء الراشدون رضي الله عنهم: أخلاقهم وخلافتهم"
        "أعمال الخلفاء الراشدين رضي الله عنهم"
        "جهود الخلفاء الراشدين رضي الله عنهم في نشر الإسلام"
        "المباديء والقيم الإسلامية في عهد الخلفاء الراشدين"
        "الهوية الذاتية"
        "التنمية الذاتية"
        "التفاعل الاجتماعي"
        "مفهوم الأمن الوطني"
        "ركائز الأمن الوطني"
        "مجالات الأمن الوطني"
        "مؤسسات الأمن الوطني"
        "المواطن والأمن الوطني"
        "مفهوم الحوار وأهميته"
        "أركان الحوار"
        "آداب الحوار"
        "الحوار الوطني"
    ];

    // جلب البيانات المحفوظة أو البدء بصف واحد افتراضي
    let savedData = JSON.parse(localStorage.getItem('lessonsTrackerData')) || [
        { classVal: classesList[0], lessonVal: lessonsList[0], completed: false, date: "" }
    ];

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        savedData.forEach((row, index) => {
            const tr = document.createElement('tr');
            if (row.completed) {
                tr.classList.add('completed');
            }

            // 1. خانة الفصل
            const tdClass = document.createElement('td');
            const selectClass = document.createElement('select');
            classesList.forEach(cls => {
                const option = document.createElement('option');
                option.value = cls;
                option.textContent = cls;
                if (cls === row.classVal) option.selected = true;
                selectClass.appendChild(option);
            });
            selectClass.onchange = (e) => updateRow(index, 'classVal', e.target.value);
            tdClass.appendChild(selectClass);

            // 2. خانة الدرس
            const tdLesson = document.createElement('td');
            const selectLesson = document.createElement('select');
            lessonsList.forEach(lesson => {
                const option = document.createElement('option');
                option.value = lesson;
                option.textContent = lesson;
                if (lesson === row.lessonVal) option.selected = true;
                selectLesson.appendChild(option);
            });
            selectLesson.onchange = (e) => updateRow(index, 'lessonVal', e.target.value);
            tdLesson.appendChild(selectLesson);

            // 3. خانة الإنجاز (علامة صح)
            const tdCheck = document.createElement('td');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = row.completed;
            checkbox.onchange = (e) => toggleComplete(index, e.target.checked);
            tdCheck.appendChild(checkbox);

            // 4. خانة تاريخ الإنجاز
            const tdDate = document.createElement('td');
            tdDate.className = 'date-cell';
            tdDate.textContent = row.date;

            // زر الحذف
            const tdAction = document.createElement('td');
            tdAction.className = 'action-col';
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = 'حذف';
            delBtn.onclick = () => deleteRow(index);
            tdAction.appendChild(delBtn);

            tr.appendChild(tdClass);
            tr.appendChild(tdLesson);
            tr.appendChild(tdCheck);
            tr.appendChild(tdDate);
            tr.appendChild(tdAction);

            tbody.appendChild(tr);
        });
    }

    function addRow() {
        savedData.push({
            classVal: classesList[0],
            lessonVal: lessonsList[0],
            completed: false,
            date: ""
        });
        saveAndRender();
    }

    function updateRow(index, key, value) {
        savedData[index][key] = value;
        saveData();
    }

    function toggleComplete(index, isChecked) {
        savedData[index].completed = isChecked;
        if (isChecked) {
            const now = new Date();
            const options = { 
                calendar: 'gregory', 
                weekday: 'long', 
                year: 'numeric', 
                month: 'numeric', 
                day: 'numeric' 
            };
            savedData[index].date = now.toLocaleDateString('ar-SA-u-ca-gregory', options);
        } else {
            savedData[index].date = "";
        }
        saveAndRender();
    }

    function deleteRow(index) {
        savedData.splice(index, 1);
        saveAndRender();
    }

    function saveData() {
        localStorage.setItem('lessonsTrackerData', JSON.stringify(savedData));
    }

    function saveAndRender() {
        saveData();
        renderTable();
    }

    // تشغيل الجدول عند فتح الصفحة
    renderTable();
</script>

</body>
</html>
